name: orchestrator
version: "1.0"
description: Files one ticket on the Kanban board (the visitor/orchestrator side of the lifecycle).

defaults:
  runtime: claude-code

profiles:
  default:
    uses:
      skills: []
      guidance: [role]
      subagents: []
      plugins: []
      runtime_resources: []

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
